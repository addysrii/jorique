<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&amp;display=swap');

      .jorique-title {
        font-family: 'Cormorant Garamond', 'Times New Roman', Georgia, serif;
        font-size: 58px;
        font-weight: 300;
        letter-spacing: 0.22em;
        fill: #1A1A1A;
        text-anchor: middle;
      }

      .jorique-underline {
        stroke: #C6A96B;
        stroke-width: 1.25;
        stroke-linecap: round;
      }

      .jorique-tagline {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.35em;
        fill: #8A847D;
        text-transform: uppercase;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Brand Name with Cormorant Garamond Light & Custom Kerning / Letterspacing -->
  <text x="410" y="96" class="jorique-title">JORIQUE</text>

  <!-- Custom Underline matching Serif Stroke Weight in Brand Gold #C6A96B -->
  <line x1="260" y1="120" x2="540" y2="120" class="jorique-underline" />

  <!-- Tagline in Cormorant Garamond SemiBold -->
  <text x="406" y="152" class="jorique-tagline">WHERE COMFORT MEETS DESIGN</text>
</svg>
