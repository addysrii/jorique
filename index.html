<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://jorique.in/" />

    <!-- Primary Meta Tags -->
    <title>JORIQUE — Where Comfort Meets Design | Luxury Home Textiles & Apparel</title>
    <meta name="title" content="JORIQUE — Where Comfort Meets Design | Luxury Home Textiles & Apparel" />
    <meta name="description" content="Discover heirloom-quality organic linen, luxury bedsheets, plush towels, and tailored essentials thoughtfully crafted for modern sanctuaries." />
    <meta name="keywords" content="JORIQUE, luxury bedding, organic linen, duvet cover, designer bedsheets, mulberry silk, cotton sheets, home textiles, everyday luxury India" />
    <meta name="author" content="JORIQUE" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#100E0D" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jorique.in/" />
    <meta property="og:title" content="JORIQUE — Where Comfort Meets Design | Luxury Home Textiles" />
    <meta property="og:description" content="Thoughtfully crafted luxury home textiles, heirloom organic fibers, and architectural tactile comfort." />
    <meta property="og:image" content="https://jorique.in/images/hero.png" />
    <meta property="og:site_name" content="JORIQUE" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Cards -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://jorique.in/" />
    <meta property="twitter:title" content="JORIQUE — Where Comfort Meets Design | Luxury Home Textiles" />
    <meta property="twitter:description" content="Thoughtfully crafted luxury home textiles, heirloom organic fibers, and architectural tactile comfort." />
    <meta property="twitter:image" content="https://jorique.in/images/hero.png" />

    <!-- Base Organization & WebSite Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://jorique.in/#organization",
            "name": "JORIQUE",
            "url": "https://jorique.in/",
            "logo": "https://jorique.in/favicon.svg",
            "description": "Premium Indian lifestyle brand offering beautifully designed everyday essentials—from luxurious home linens to refined apparel and fragrances.",
            "sameAs": []
          },
          {
            "@type": "WebSite",
            "@id": "https://jorique.in/#website",
            "url": "https://jorique.in/",
            "name": "JORIQUE",
            "publisher": { "@id": "https://jorique.in/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://jorique.in/shop?search={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- Fonts: Cormorant Garamond & Manrope (JORIQUE Brand Spec) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
